<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Тревел</title><link rel="stylesheet" href="styles.css"/></head>
<body><div id="app"></div><div id="toast"></div><script>window.addEventListener('error',e=>{document.querySelector('#app').innerHTML=`<main style="padding:40px;font-family:system-ui"><h1>Не удалось запустить Тревел</h1><p>${e.message}</p></main>`});window.addEventListener('unhandledrejection',e=>{document.querySelector('#app').innerHTML=`<main style="padding:40px;font-family:system-ui"><h1>Не удалось запустить Тревел</h1><p>${e.reason?.message||e.reason}</p></main>`})</script><script src="config.js"></script><script type="module" src="app.js?v=20261118-flight-lookup"></script></body></html>
